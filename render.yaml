# NOTE on migrations: there is deliberately no `preDeployCommand` here. Render
# pre-deploy commands require a paid instance type and this service runs on
# `plan: free`, so a preDeployCommand would be accepted by the Blueprint and then
# silently never execute. `docker-entrypoint.sh` runs `alembic upgrade head`
# inside the container on every boot instead, which works on any instance type.
#
# NOTE on COMMIT_SHA: not listed below because Render injects `RENDER_GIT_COMMIT`
# into every service automatically, and `platform.health.resolve_commit_sha()`
# falls back to it. Blueprints cannot pass Docker build args, so the image's
# COMMIT_SHA build arg stays empty in this deployment path.
services:
  - type: web
    name: inkprint-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INKPRINT_SIGNING_KEY_PRIVATE
        sync: false
      - key: INKPRINT_SIGNING_KEY_PUBLIC
        sync: false
      - key: INKPRINT_KEY_ID
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        sync: false
      - key: OPENROUTER_MODEL_PRIMARY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      # Platform contract v2 (docs/specs/09-platform-token.md): the public halves
      # of bastion's key and of inkprint-frontend's proxy key, base64 SPKI DER.
      - key: BASTION_SIGNING_KEY_PUBLIC
        sync: false
      - key: INKPRINT_FRONTEND_SIGNING_KEY_PUBLIC
        sync: false
      # Transition switch: tolerates a missing token only. Flip to "false" once
      # inkprint-frontend's signing proxy is live (contract v2 rollout step d).
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: "production"
