[project]
name = "inkprint"
version = "0.1.0"
description = "Content provenance and AI-training-data leak detection"
readme = "README.md"
license = "BUSL-1.1"
authors = [
    { name = "Abdul-Muizz Anwar", email = "abdulmuizz1310@outlook.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43.0",
    "simhash>=2.1",
    "voyageai>=0.3",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "jsonschema>=4.23",
    "langdetect>=1.0.9",
    "qrcode[pil]>=8.0",
    # >=8.1 is a hard floor, not a preference: FastAPI 0.141 routes through a
    # `_IncludedRouter`, and 7.x reads `.path` straight off the route object, so
    # every instrumented request raises
    #   AttributeError: '_IncludedRouter' object has no attribute 'path'
    # from prometheus_fastapi_instrumentator/routing.py. The old `>=7.0` floor
    # let the resolver pick a version that cannot serve a request.
    "prometheus-fastapi-instrumentator>=8.1",
    # Driver behind core.db.DEFAULT_DATABASE_URL, the documented zero-config
    # default. Runtime (not dev): the production image installs with --no-dev.
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "respx>=0.21",
    # Real-Postgres integration tier (tests/integration/test_postgres_tier.py).
    "testcontainers[postgres]>=4.15.0",
    "pyyaml>=6.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "types-boto3>=1.43.62",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkprint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "F841", "SIM117", "RUF059"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inkprint"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "voyageai.*",
    "simhash.*",
    "langdetect.*",
    "prometheus_fastapi_instrumentator.*",
    "qrcode.*",
    "yaml.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: slow end-to-end tests (CI-only)",
    # Wired end-to-end through the ASGI app (routers + services + repositories).
    # Needs no Docker and no Postgres: tests/conftest.py binds in-memory SQLite.
    # These run in the default CI test job — excluding them would leave the
    # router/service layers unverified there.
    "integration: app-level end-to-end tests through the ASGI app (in-memory SQLite)",
    # The only tier that genuinely needs Docker: a real Postgres server via
    # Testcontainers. Self-skips when Docker is unavailable; own CI job.
    "postgres: requires Docker — real Postgres via Testcontainers",
]

[tool.coverage.run]
# SQLAlchemy's async layer runs DB work via greenlets, and aiosqlite uses a
# worker thread; without this, coverage misses lines executed across those
# context switches (e.g. async route handlers driven through ASGITransport).
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
