name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      # Excludes only `slow` and the Docker-dependent `postgres` tier. The
      # `integration` tests run here on purpose: they need no Docker and no
      # Postgres (conftest binds in-memory SQLite), and deselecting them left the
      # router/service layers unmeasured by the coverage gate.
      - run: uv run pytest -m "not slow and not postgres" --cov=src/inkprint --cov-report=term-missing

  postgres:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      # Real Postgres via Testcontainers (Docker is preinstalled on GitHub-hosted
      # runners). This is the only tier that exercises JSONB / UUID[] / BYTEA /
      # TIMESTAMPTZ and the Alembic chain the way Neon does.
      - run: uv run pytest -m postgres -q

  build:
    needs: [test, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{ github.repository }}:${{ github.sha }} --build-arg COMMIT_SHA=${{ github.sha }} .

  smoke:
    # Post-deploy check. Render auto-deploys main on push (there is no deploy
    # job here), so this polls the live service afterwards.
    #
    # Env-gated on purpose: with the repository variable SMOKE_BASE_URL unset
    # the script exits 0 with a notice and makes zero HTTP requests. The
    # free-tier service is periodically cold or suspended, and an unconditional
    # probe would fail CI for reasons unrelated to the change under test.
    #
    # SMOKE_BASE_URL is a *variable*, not a secret (the value is a public URL,
    # and secrets are unavailable to fork PRs), and holds a bare origin — the
    # script appends /health itself. It is deliberately scoped to this job: the
    # test job must leave it unset so the smoke unit test keeps self-skipping
    # there, which is the behaviour the README's test counts were measured with.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - name: Poll live /health (skipped when SMOKE_BASE_URL is unset)
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: uv run python scripts/smoke_health.py

  # NOTE: no deploy job — the Render service auto-deploys main on push.
